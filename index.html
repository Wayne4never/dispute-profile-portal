<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>公开纠纷与关系检索台</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1160px;margin:auto;padding:24px 16px 60px}.hero{background:#111827;color:white;border-radius:20px;padding:28px}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.hero .muted{color:#cbd5e1}.search{display:flex;gap:10px;margin-top:20px}.search input{flex:1;border:0;border-radius:12px;padding:15px;font-size:16px}.search button{border:0;border-radius:12px;padding:14px 18px;font-weight:800}.card{background:white;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 16px #0f172a0f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.title{font-weight:850;font-size:18px;margin-bottom:8px}.item{padding:14px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.item a{color:#0f4c81;text-decoration:none;font-weight:750;display:block;margin:5px 0}.tag,.chip{display:inline-block;font-size:11px;border:1px solid #cbd5e1;border-radius:999px;padding:4px 8px;margin:2px 5px 2px 0;color:#475569}.case{background:#fef2f2;color:#991b1b;border-color:#fecaca}.official{background:#f0fdf4;color:#166534;border-color:#86efac}.source{font-size:12px;color:#64748b;margin-top:5px}.empty{padding:24px;text-align:center;color:#64748b}.status{font-size:13px;margin:14px 0}.settings{margin-top:12px;font-size:13px}.settings input{width:min(100%,620px);padding:9px;border-radius:8px;border:1px solid #cbd5e1}.judicial{border:2px solid #fecaca}.srcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.src{padding:10px;border-radius:10px;background:#f8fafc;font-size:12px}.ok{color:#166534}.warn{color:#92400e}@media(max-width:720px){.grid,.srcgrid{grid-template-columns:1fr}.search{flex-direction:column}}</style></head><body><div class="wrap"><section class="hero"><h1>公开纠纷与关系检索台</h1><div class="muted">V6 数据源模式：司法数据独立检索，不再只靠普通搜索引擎。法院官方索引、执行公开索引、裁判文书公开存档与中文搜索并行。</div><div class="search"><input id="q" placeholder="公司全称 / 人名 + 公司 / 案号"><button id="go">检索</button></div><div class="settings">后端 API：<input id="api" value="https://dispute-profile-portal.x2338052806.workers.dev"></div></section><div id="status" class="status muted">等待检索</div><div id="out"><div class="card empty">输入检索对象。</div></div></div><script>const API='https://dispute-profile-portal.x2338052806.workers.dev',$=s=>document.querySelector(s),q=$('#q'),api=$('#api'),out=$('#out'),st=$('#status');api.value=localStorage.getItem('backend_api')||API;function e(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function item(r){return `<div class="item"><div><span class="tag ${r.authority==='一级'?'official':''}">${e(r.authority)} · ${e(r.source_type)}</span>${r.case_no?`<span class="tag case">${e(r.case_no)}</span>`:''}</div><a href="${e(r.url)}" target="_blank" rel="noopener">${e(r.title)}</a><div>${e(r.snippet||'')}</div><div class="source">${e(r.domain)} · ${e(r.engine)}</div></div>`}function sec(t,a,c=''){return `<div class="card ${c}"><div class="title">${e(t)} <span class="chip">${a.length}</span></div>${a.length?a.map(item).join(''):'<div class="empty">本数据源组合暂未返回结果；不代表不存在记录。</div>'}</div>`}function render(d){const j=d.judicial_results||[],x=d.enforcement_results||[],r=d.regulatory_results||[],b=d.business_results||[],n=d.news_results||[];const ss=Object.entries(d.source_status||{});out.innerHTML=`<div class="grid"><div class="card"><div class="title">检索对象</div><b>${e(d.query)}</b><div class="source">后端 ${e(d.version)}</div></div><div class="card"><div class="title">数据源状态</div><div class="srcgrid">${ss.map(([k,v])=>`<div class="src"><b>${e(k)}</b><br><span class="${v.ok?'ok':'warn'}">${v.ok?'已响应':'不可用'}</span> · 原始返回 ${v.returned||0}</div>`).join('')}</div></div></div>${sec('司法 / 裁判文书',''.split('').filter(Boolean),'')}`;out.innerHTML=out.innerHTML.replace(sec('司法 / 裁判文书',[],''),sec('司法 / 裁判文书',j,'judicial'))+sec('执行 / 失信',x)+`<div class="grid">${sec('监管 / 处罚',r)}${sec('工商 / 任职',b)}</div>`+sec('新闻 / 官网',n)+`<div class="card"><div class="title">当前边界</div><div class="source">${e(d.limitations||'')}</div></div>`}async function run(){const term=q.value.trim();if(!term)return;const base=api.value.trim().replace(/\/$/,'')||API;localStorage.setItem('backend_api',base);st.textContent='正在分别请求司法数据源…';out.innerHTML='<div class="card empty">检索中…</div>';try{const r=await fetch(`${base}/api/search?q=${encodeURIComponent(term)}`);if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();render(d);st.textContent=`完成 · 司法 ${(d.judicial_results||[]).length} · 执行 ${(d.enforcement_results||[]).length} · 后端 ${d.version}`;st.className='status ok'}catch(err){st.textContent='查询失败：'+err.message;st.className='status warn'}}$('#go').onclick=run;q.onkeydown=x=>{if(x.key==='Enter')run()};</script></body></html>
