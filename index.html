<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>公开纠纷与关系检索台</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1160px;margin:auto;padding:24px 16px 60px}.hero{background:#111827;color:white;border-radius:20px;padding:28px;box-shadow:0 14px 34px rgba(0,0,0,.12)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.hero .muted{color:#cbd5e1}.search{display:flex;gap:10px;margin-top:20px}.search input{flex:1;border:0;border-radius:12px;padding:15px 16px;font-size:16px}.search button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:#fff;color:#111827}.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}.chip{font-size:12px;background:#e2e8f0;border-radius:999px;padding:6px 10px}.card{background:white;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 16px rgba(15,23,42,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.title{font-weight:800;font-size:18px;margin-bottom:8px}.section-title{font-size:20px;font-weight:900;margin:22px 0 4px}.judicial{border:1px solid #fecaca}.enforcement{border:1px solid #fed7aa}.item{padding:14px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.item a{color:#0f4c81;text-decoration:none;font-weight:750;display:block;margin:5px 0}.tag{display:inline-block;font-size:11px;border:1px solid #cbd5e1;border-radius:999px;padding:3px 7px;margin:2px 5px 2px 0;color:#475569}.tag.primary{border-color:#86efac;background:#f0fdf4;color:#166534}.tag.case{border-color:#fecaca;background:#fef2f2;color:#991b1b}.empty{padding:24px;text-align:center;color:#64748b}.status{font-size:13px}.ok{color:#166534}.warn{color:#92400e}.err{color:#991b1b}.settings{margin-top:12px;font-size:13px}.settings input{width:min(100%,620px);padding:10px;border:1px solid #cbd5e1;border-radius:9px}.source{font-size:12px;color:#64748b;margin-top:5px;word-break:break-all}.notice{font-size:12px;line-height:1.65;color:#64748b}.timeline{border-left:2px solid #cbd5e1;margin-left:7px;padding-left:14px}.timeline .t{margin:12px 0}.summaryrow{display:flex;flex-wrap:wrap;gap:7px}details{margin-top:14px}summary{cursor:pointer;font-weight:800;color:#475569}@media(max-width:720px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.search button{width:100%}}</style></head><body><div class="wrap"><section class="hero"><h1>公开纠纷与关系检索台</h1><div class="muted">司法优先模式：法院裁判、执行失信、监管处罚、工商任职、新闻资料分开检索和展示，避免重要司法信息被普通网页噪音淹没。</div><div class="search"><input id="q" placeholder="例如：上海某某科技有限公司 / 张三 某公司 / (2023)沪02民终9951号"><button id="go">检索</button></div><div class="settings">后端 API：<input id="api" value="https://dispute-profile-portal.x2338052806.workers.dev"></div></section><div class="bar"><span class="chip">司法/裁判专栏</span><span class="chip">执行/失信专栏</span><span class="chip">监管/处罚</span><span class="chip">工商/任职</span><span class="chip">新闻/官网</span><span id="status" class="status muted">等待检索</span></div><div id="out"><div class="card empty">输入公司、人物或案号即可检索。</div></div></div><script>const DEFAULT_API='https://dispute-profile-portal.x2338052806.workers.dev';const $=s=>document.querySelector(s),q=$('#q'),api=$('#api'),out=$('#out'),status=$('#status');api.value=localStorage.getItem('backend_api')||DEFAULT_API;api.addEventListener('change',()=>localStorage.setItem('backend_api',api.value.trim().replace(/\/$/,'')));function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function item(r){return `<div class="item"><div><span class="tag ${r.authority==='一级'?'primary':''}">${esc(r.authority)} · ${esc(r.source_type)}</span><span class="tag">${esc(r.evidence_state)}</span>${r.case_no?`<span class="tag case">${esc(r.case_no)}</span>`:''}</div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><div>${esc(r.snippet||'')}</div><div class="source">${esc(r.domain||'')} · ${esc(r.engine||'')} · ${esc(r.lane||'')}</div></div>`}function sec(title,rows,cls='',empty='暂未检索到结果'){return `<div class="card ${cls}"><div class="title">${esc(title)} <span class="chip">${rows.length}</span></div>${rows.length?rows.map(item).join(''):`<div class="empty">${esc(empty)}</div>`}</div>`}function render(d){const j=d.judicial_results||[],e=d.enforcement_results||[],r=d.regulatory_results||[],b=d.business_results||[],n=d.news_results||[],o=d.other_results||[],tl=d.timeline||[];out.innerHTML=`<div class="grid"><div class="card"><div class="title">检索对象</div><b>${esc(d.query)}</b><div class="muted">推定类型：${esc(d.entity_type||'未知')} · 后端 ${esc(d.version||'')}</div></div><div class="card"><div class="title">结果概览</div><div class="summaryrow"><span class="chip">司法 ${j.length}</span><span class="chip">执行 ${e.length}</span><span class="chip">监管 ${r.length}</span><span class="chip">工商 ${b.length}</span><span class="chip">新闻 ${n.length}</span></div><div class="source">${esc(d.note||'')}</div></div></div><div class="section-title">司法与风险</div>${sec('司法 / 裁判专栏',j,'judicial','暂未从免费公开搜索入口检索到裁判文书。这里为空不代表不存在案件。')}${sec('执行 / 失信专栏',e,'enforcement','暂未检索到执行、失信或限制高消费相关结果。')}<div class="grid">${sec('监管 / 处罚',r)}${sec('工商 / 任职',b)}</div>${sec('新闻 / 官网',n)}${o.length?`<details><summary>查看 ${o.length} 条其他相关线索</summary>${sec('其他线索',o)}</details>`:''}<div class="grid"><div class="card"><div class="title">时间线</div>${tl.length?`<div class="timeline">${tl.map(t=>`<div class="t"><b>${esc(t.date)}</b> <span class="tag">${esc(t.category||'')}</span>${t.case_no?` <span class="tag case">${esc(t.case_no)}</span>`:''}<br>${esc(t.title)}</div>`).join('')}</div>`:'<div class="empty">暂未抽取到明确日期</div>'}</div><div class="card"><div class="title">证据边界</div><div class="notice">司法专栏会单独搜索法院官网、裁判文书网、人民法院公告、执行信息公开网及公开裁判文书存档。搜索结果仍需打开原文核验；专栏为空只说明当前免费检索入口没有返回可验证结果，不代表目标不存在案件。</div></div></div>`}async function run(){const term=q.value.trim();if(!term)return;const base=api.value.trim().replace(/\/$/,'')||DEFAULT_API;localStorage.setItem('backend_api',base);status.textContent='正在执行司法优先检索…';status.className='status warn';out.innerHTML='<div class="card empty">正在分别检索司法、执行、监管、工商和新闻来源，通常需要数秒。</div>';try{const rr=await fetch(`${base}/api/search?q=${encodeURIComponent(term)}`);if(!rr.ok)throw new Error(`HTTP ${rr.status}`);const d=await rr.json();render(d);status.textContent=`完成：司法 ${(d.judicial_results||[]).length} · 执行 ${(d.enforcement_results||[]).length} · 监管 ${(d.regulatory_results||[]).length}`;status.className='status ok'}catch(e){status.textContent='查询失败';status.className='status err';out.innerHTML=`<div class="card"><b>后端连接失败：</b>${esc(e.message)}</div>`}}$('#go').onclick=run;q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script></body></html>
