<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>公开纠纷与关系检索台</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.hero{background:#111827;color:white;border-radius:20px;padding:28px;box-shadow:0 14px 34px rgba(0,0,0,.12)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.hero .muted{color:#cbd5e1}.search{display:flex;gap:10px;margin-top:20px}.search input{flex:1;border:0;border-radius:12px;padding:15px 16px;font-size:16px}.search button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:#fff;color:#111827}.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}.chip{font-size:12px;background:#e2e8f0;border-radius:999px;padding:6px 10px}.card{background:white;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 16px rgba(15,23,42,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.title{font-weight:800;font-size:18px;margin-bottom:8px}.item{padding:14px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.item a{color:#0f4c81;text-decoration:none;font-weight:750;display:block;margin:5px 0}.tag{display:inline-block;font-size:11px;border:1px solid #cbd5e1;border-radius:999px;padding:3px 7px;margin:2px 5px 2px 0;color:#475569}.tag.primary{border-color:#86efac;background:#f0fdf4;color:#166534}.tag.mid{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.empty{padding:28px;text-align:center;color:#64748b}.status{font-size:13px}.ok{color:#166534}.warn{color:#92400e}.err{color:#991b1b}.settings{margin-top:12px;font-size:13px}.settings input{width:min(100%,620px);padding:10px;border:1px solid #cbd5e1;border-radius:9px}.source{font-size:12px;color:#64748b;margin-top:5px;word-break:break-all}.notice{font-size:12px;line-height:1.65;color:#64748b}.timeline{border-left:2px solid #cbd5e1;margin-left:7px;padding-left:14px}.timeline .t{margin:12px 0}.summaryrow{display:flex;flex-wrap:wrap;gap:7px}details{margin-top:14px}summary{cursor:pointer;font-weight:800;color:#475569}@media(max-width:720px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.search button{width:100%}}</style></head><body><div class="wrap"><section class="hero"><h1>公开纠纷与关系检索台</h1><div class="muted">证据优先模式：优先保留法院、政府、企业信息平台、主流媒体及与目标名称高度吻合的公开资料；名录页、黄页和弱相关页面默认过滤。</div><div class="search"><input id="q" placeholder="例如：上海某某科技有限公司 / 张三 某公司 / (2023)沪02民终9951号"><button id="go">检索</button></div><div class="settings">后端 API：<input id="api" value="https://dispute-profile-portal.x2338052806.workers.dev"></div></section><div class="bar"><span class="chip">法院/判决</span><span class="chip">执行风险</span><span class="chip">政府/监管</span><span class="chip">工商线索</span><span class="chip">新闻/官网</span><span class="chip">人物关系</span><span id="status" class="status muted">等待检索</span></div><div id="out"><div class="card empty">输入公司、人物或案号即可检索。</div></div></div><script>const DEFAULT_API='https://dispute-profile-portal.x2338052806.workers.dev';const $=s=>document.querySelector(s),q=$('#q'),api=$('#api'),out=$('#out'),status=$('#status');api.value=localStorage.getItem('backend_api')||DEFAULT_API;api.addEventListener('change',()=>localStorage.setItem('backend_api',api.value.trim().replace(/\/$/,'')));function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function chips(o){return Object.entries(o||{}).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join(' ')||'<span class="muted">暂无</span>'}function item(r){return `<div class="item"><div><span class="tag ${r.authority==='一级'?'primary':r.authority==='二级'?'mid':''}">${esc(r.authority)} · ${esc(r.source_type)}</span><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.evidence_state)}</span><span class="tag">质量分 ${esc(r.score)}</span></div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><div>${esc(r.snippet||'')}</div><div class="source">${esc(r.domain||'')} · ${esc(r.engine||'')} · ${esc(r.lane||'')}</div></div>`}function render(d){const primary=d.primary_results||[],secondary=d.secondary_results||[],tl=d.timeline||[];out.innerHTML=`<div class="grid"><div class="card"><div class="title">检索对象</div><b>${esc(d.query)}</b><div class="muted">推定类型：${esc(d.entity_type||'未知')} · 后端 ${esc(d.version||'')}</div></div><div class="card"><div class="title">结果质量</div><div class="summaryrow"><span class="chip">关键证据 ${primary.length}</span><span class="chip">相关线索 ${secondary.length}</span></div><div class="source">${esc(d.note||'')}</div></div></div><div class="grid"><div class="card"><div class="title">关键证据</div>${primary.length?primary.map(item).join(''):'<div class="empty">暂未找到达到“关键证据”门槛的结果。宁缺毋滥。</div>'}<details><summary>查看 ${secondary.length} 条相关线索</summary>${secondary.length?secondary.map(item).join(''):'<div class="empty">暂无次级线索</div>'}</details></div><div><div class="card"><div class="title">来源结构</div><div class="summaryrow">${chips(d.sources)}</div><div class="source">搜索入口：${Object.entries(d.engines||{}).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')||'暂无'}</div></div><div class="card"><div class="title">证据概览</div><div class="summaryrow">${chips(d.counts)}</div></div><div class="card"><div class="title">时间线</div>${tl.length?`<div class="timeline">${tl.map(t=>`<div class="t"><b>${esc(t.date)}</b> <span class="tag">${esc(t.category||'')}</span><br>${esc(t.title)}</div>`).join('')}</div>`:'<div class="empty">暂未抽取到关键证据中的明确日期</div>'}</div><div class="card"><div class="title">证据边界</div><div class="notice">“关键证据”代表来源和名称匹配都达到较高门槛，并不自动等于法律事实。法院、政府等一级来源仍应打开原文核验；裁判文书存档、企业信息平台和主流媒体属于较强线索。次级网页默认折叠，仅作交叉检索入口。不会尝试获取身份证号、家庭住址、私人手机号、实时位置或泄露数据库信息。</div></div></div></div>`}async function run(){const term=q.value.trim();if(!term)return;const base=api.value.trim().replace(/\/$/,'')||DEFAULT_API;localStorage.setItem('backend_api',base);status.textContent='正在执行证据优先检索…';status.className='status warn';out.innerHTML='<div class="card empty">正在查询多个中文搜索入口并过滤低价值结果，通常需要数秒。</div>';try{const r=await fetch(`${base}/api/search?q=${encodeURIComponent(term)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();render(d);status.textContent=`完成：${(d.primary_results||[]).length} 条关键证据，${(d.secondary_results||[]).length} 条相关线索`;status.className='status ok'}catch(e){status.textContent='查询失败';status.className='status err';out.innerHTML=`<div class="card"><b>后端连接失败：</b>${esc(e.message)}</div>`}}$('#go').onclick=run;q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script></body></html>
