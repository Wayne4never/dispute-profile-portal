<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>公开纠纷与关系检索台</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.hero{background:#111827;color:white;border-radius:20px;padding:28px;box-shadow:0 14px 34px rgba(0,0,0,.12)}h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.hero .muted{color:#cbd5e1}.search{display:flex;gap:10px;margin-top:20px}.search input{flex:1;border:0;border-radius:12px;padding:15px 16px;font-size:16px}.search button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:#fff;color:#111827}.bar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}.chip{font-size:12px;background:#e2e8f0;border-radius:999px;padding:6px 10px}.card{background:white;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 16px rgba(15,23,42,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.title{font-weight:800;font-size:18px;margin-bottom:8px}.item{padding:14px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.item a{color:#0f4c81;text-decoration:none;font-weight:750;display:block;margin:5px 0}.tag{display:inline-block;font-size:11px;border:1px solid #cbd5e1;border-radius:999px;padding:3px 7px;margin:2px 5px 2px 0;color:#475569}.tag.primary{border-color:#86efac;background:#f0fdf4;color:#166534}.tag.mid{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.empty{padding:28px;text-align:center;color:#64748b}.status{font-size:13px}.ok{color:#166534}.warn{color:#92400e}.err{color:#991b1b}.settings{margin-top:12px;font-size:13px}.settings input{width:min(100%,620px);padding:10px;border:1px solid #cbd5e1;border-radius:9px}.source{font-size:12px;color:#64748b;margin-top:5px;word-break:break-all}.notice{font-size:12px;line-height:1.65;color:#64748b}.timeline{border-left:2px solid #cbd5e1;margin-left:7px;padding-left:14px}.timeline .t{margin:12px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.summaryrow{display:flex;flex-wrap:wrap;gap:7px}@media(max-width:720px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.search button{width:100%}}</style></head><body><div class="wrap"><section class="hero"><h1>公开纠纷与关系检索台</h1><div class="muted">面向中国大陆公司、品牌、人物和案号。中文搜索引擎 + 官方站点定向检索，按来源等级、相关度和证据状态整理。</div><div class="search"><input id="q" placeholder="例如：上海某某科技有限公司 / 张三 某公司 / (2023)沪02民终9951号"><button id="go">检索</button></div><div class="settings">后端 API：<input id="api" value="https://dispute-profile-portal.x2338052806.workers.dev"></div></section><div class="bar"><span class="chip">法院/判决</span><span class="chip">执行风险</span><span class="chip">政府/监管</span><span class="chip">工商线索</span><span class="chip">新闻/官网</span><span class="chip">人物关系</span><span id="status" class="status muted">等待检索</span></div><div id="out"><div class="card empty">输入公司、人物或案号即可检索。</div></div></div><script>const DEFAULT_API='https://dispute-profile-portal.x2338052806.workers.dev';const $=s=>document.querySelector(s),q=$('#q'),api=$('#api'),out=$('#out'),status=$('#status');api.value=localStorage.getItem('backend_api')||DEFAULT_API;api.addEventListener('change',()=>localStorage.setItem('backend_api',api.value.trim().replace(/\/$/,'')));function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function chips(o){return Object.entries(o||{}).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join(' ')||'<span class="muted">暂无</span>'}function render(d){const rs=d.results||[],tl=d.timeline||[];out.innerHTML=`<div class="grid"><div class="card"><div class="title">检索对象</div><b>${esc(d.query)}</b><div class="muted">推定类型：${esc(d.entity_type||'未知')} · 后端 ${esc(d.version||'')}</div></div><div class="card"><div class="title">来源结构</div><div class="summaryrow">${chips(d.sources)}</div><div class="source">搜索入口：${Object.entries(d.engines||{}).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')||'暂无'}</div></div></div><div class="card"><div class="title">检索覆盖</div><div class="summaryrow">${(d.lanes||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="notice">${esc(d.note||'')}<br>${esc(d.limitations||'')}</div></div><div class="grid"><div class="card"><div class="title">公开证据</div>${rs.length?rs.map(r=>`<div class="item"><div><span class="tag ${r.authority==='一级'?'primary':r.authority==='二级'?'mid':''}">${esc(r.authority)} · ${esc(r.source_type)}</span><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.evidence_state)}</span><span class="tag">相关度 ${esc(r.relevance_score)}</span></div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><div>${esc(r.snippet||'')}</div><div class="source">${esc(r.domain||'')} · ${esc(r.engine||'')} · ${esc(r.lane||'')}</div></div>`).join(''):'<div class="empty">没有找到达到相关性阈值的结果。不会用无关网页凑数。</div>'}</div><div><div class="card"><div class="title">证据概览</div><div class="summaryrow">${chips(d.counts)}</div></div><div class="card"><div class="title">时间线</div>${tl.length?`<div class="timeline">${tl.map(t=>`<div class="t"><b>${esc(t.date)}</b> <span class="tag">${esc(t.category||'')}</span><br>${esc(t.title)}</div>`).join('')}</div>`:'<div class="empty">暂未抽取到明确日期</div>'}</div><div class="card"><div class="title">证据边界</div><div class="notice">一级来源代表政府、法院、交易所等官方域名，但搜索摘要仍不是最终事实认定，重要结论应打开原文核验。二级来源包括主流媒体和公开企业信息平台。三级网页只作为线索。人物同名必须结合公司、地区、职位和时间交叉确认。不会尝试获取身份证号、家庭住址、私人手机号、实时位置或泄露数据库信息。</div></div></div></div>`}async function run(){const term=q.value.trim();if(!term)return;const base=api.value.trim().replace(/\/$/,'')||DEFAULT_API;localStorage.setItem('backend_api',base);status.textContent='正在执行中文多源检索…';status.className='status warn';out.innerHTML='<div class="card empty">正在查询多个中文搜索入口和官方定向来源，通常需要数秒。</div>';try{const r=await fetch(`${base}/api/search?q=${encodeURIComponent(term)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();render(d);status.textContent=`完成：${(d.results||[]).length} 条相关公开结果`;status.className='status ok'}catch(e){status.textContent='查询失败';status.className='status err';out.innerHTML=`<div class="card"><b>后端连接失败：</b>${esc(e.message)}<br><span class="muted">可先访问 Worker 的 /health 检查部署状态。</span></div>`}}$('#go').onclick=run;q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script></body></html>
